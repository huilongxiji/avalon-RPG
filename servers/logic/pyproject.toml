[project]
name = "avalon-logic"
version = "0.1.0"
description = "阿瓦隆逻辑后端：规则引擎、战斗计算、游戏业务、模拟任务，唯一读写游戏数据库"
requires-python = ">=3.12,<3.13"
dependencies = [
    "avalon-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tortoise-orm>=1.1",
    "openpyxl>=3.1",
]

[project.scripts]
# 启动逻辑后端（开发时加 --reload）
avalon-logic = "avalon_logic.__main__:main"
# 检查并应用数据库表结构升级（启动脚本会先运行它）
avalon-logic-migrate = "avalon_logic.store.migrate:main"

[tool.uv.sources]
avalon-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avalon_logic"]
