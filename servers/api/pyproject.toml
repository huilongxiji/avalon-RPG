[project]
name = "avalon-api"
version = "0.1.0"
description = "阿瓦隆 API 后端：对外统一入口，给网站、模拟器、bot 前端（以后还有安卓软件）提供接口"
requires-python = ">=3.12,<3.13"
dependencies = [
    "avalon-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tortoise-orm>=1.1",
    "httpx>=0.27",
]

[project.scripts]
# 启动 API 后端（开发时加 --reload）
avalon-api = "avalon_api.__main__:main"
avalon-api-migrate = "avalon_api.store.migrate:main"

[tool.uv.sources]
avalon-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avalon_api"]
