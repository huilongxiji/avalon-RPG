[project]
name = "avalon-contracts"
version = "0.1.0"
description = "阿瓦隆共享数据模型：接口格式、规则数据格式、错误码、事件、工作表定义"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avalon_contracts"]
