# QQ 机器人：独立的 uv 项目（不属于根目录的后端工作区），有自己的 uv.lock 和 .venv
# 在本目录运行 uv run bot.py 启动（第一次运行会自动安装 Python 3.12 和依赖）
[project]
name = "avalon-bot"
version = "0.1.0"
description = "阿瓦隆 bot 前端：NoneBot2 应用，只负责解析指令、调用 API、排版回复"
requires-python = ">=3.12,<3.13"
dependencies = [
    "avalon-contracts",
    "nonebot2[fastapi,httpx,websockets]==2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "httpx>=0.27",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.uv.sources]
# 共享数据模型按路径引用（只用代码，不读根目录的配置）
avalon-contracts = { path = "../../servers/contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avalon_bot"]

# NoneBot 配置：bot.py 用 nonebot.load_from_toml 读取这里的插件列表（适配器在 bot.py 里注册）
# 格式："来源 → 模块列表"，本地代码的来源写 "@local"
[tool.nonebot]
plugin_dirs = []

[tool.nonebot.plugins]
# 按模块名加载本地插件；迁移一个旧插件就在这里加一行
"@local" = [
    "avalon_bot.plugins.health",
    "avalon_bot.plugins.status",
    "avalon_bot.plugins.game",
    "avalon_bot.plugins.oops",
]
